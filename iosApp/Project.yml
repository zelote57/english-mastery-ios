# iosApp — Project Configuration
# Generate the .xcodeproj with: `xcodegen generate`

name: EnglishMastery
options:
  bundleIdPrefix: com.englishmastery
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: true

targets:
  EnglishMastery:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.englishmastery.app
        INFOPLIST_KEY_CFBundleDisplayName: "English Mastery"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: true
    scheme:
      testTargets:
        - EnglishMasteryTests
      gatherCoverageData: false

  EnglishMasteryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EnglishMastery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.englishmastery.app.tests
