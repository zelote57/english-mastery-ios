# ⚙️ CI/CD: Generate Xcode project, build, and run tests on GitHub macOS runner
name: iOS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare CI log directories
        run: mkdir -p .ci-logs/text

      - name: Select Xcode 16+ (Swift 6)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          {
            xcodebuild -version
            swift --version
          } 2>&1 | tee .ci-logs/text/00-environment.log

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee ../.ci-logs/text/01-xcodegen.log

      - name: Resolve iOS Simulator (iPhone 15 / iOS 17+)
        id: sim
        run: |
          SIM_UDID=$(python3 - <<'PY'
          import json, re, subprocess, sys

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              major, minor = int(m.group(1)), int(m.group(2))
              if major < 17:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((d["name"] == "iPhone 15", major, minor, d["name"], d["udid"]))

          if not candidates:
              raise SystemExit("No available iOS 17+ iPhone simulator found on runner.")

          candidates.sort(key=lambda item: (item[0], item[1], item[2], item[3]), reverse=True)
          best = candidates[0]
          print(f"Selected simulator: {best[3]} (iOS {best[1]}.{best[2]}, {best[4]})", file=sys.stderr, flush=True)
          print(best[4])
          PY
          )
          echo "Selected simulator UDID: $SIM_UDID" > .ci-logs/text/00-simulator.log
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"

      - name: Build for Testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project iosApp/EnglishMastery.xcodeproj \
            -scheme EnglishMastery \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) RAG_DIAGNOSTICS' \
            2>&1 | tee .ci-logs/text/02-build-for-testing.log

      - name: Run Tests
        run: |
          set -o pipefail
          rm -rf .ci-logs/TestResults.xcresult
          xcodebuild test \
            -project iosApp/EnglishMastery.xcodeproj \
            -scheme EnglishMastery \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath .derivedData \
            -resultBundlePath .ci-logs/TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) RAG_DIAGNOSTICS' \
            2>&1 | tee .ci-logs/text/03-xcodebuild-test.log

      - name: Build standard app without diagnostics
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/EnglishMastery.xcodeproj \
            -scheme EnglishMastery \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Release \
            -derivedDataPath .derivedData-standard \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .ci-logs/text/05-standard-build.log

      - name: Build unsigned diagnostic IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/EnglishMastery.xcodeproj \
            -scheme EnglishMastery \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath .derivedData-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) RAG_DIAGNOSTICS' \
            2>&1 | tee .ci-logs/text/04-device-build.log
          APP=".derivedData-device/Build/Products/Debug-iphoneos/EnglishMastery.app"
          test -f "$APP/EnglishMastery"
          /usr/libexec/PlistBuddy -c "Add :RAGBuildCommit string ${{ github.sha }}" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :RAGBuildCommit' "$APP/Info.plist")" = "${{ github.sha }}"
          lipo -verify_arch arm64 "$APP/EnglishMastery"
          mkdir -p .ci-ipa/Payload
          cp -R "$APP" .ci-ipa/Payload/
          (cd .ci-ipa && zip -qry EnglishMastery-Diagnostic.ipa Payload)
          unzip -tq .ci-ipa/EnglishMastery-Diagnostic.ipa
          printf 'Commit: %s\n' "${{ github.sha }}" > .ci-ipa/build-info.txt
          shasum -a 256 .ci-ipa/EnglishMastery-Diagnostic.ipa >> .ci-ipa/build-info.txt

      - name: Upload unsigned diagnostic IPA
        uses: actions/upload-artifact@v7
        with:
          name: rag-diagnostic-ipa-${{ github.run_number }}
          path: |
            .ci-ipa/EnglishMastery-Diagnostic.ipa
            .ci-ipa/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summarize Build & Test Diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os, re

          log_files = [
              ".ci-logs/text/00-environment.log",
              ".ci-logs/text/01-xcodegen.log",
              ".ci-logs/text/02-build-for-testing.log",
              ".ci-logs/text/03-xcodebuild-test.log",
              ".ci-logs/text/04-device-build.log",
              ".ci-logs/text/05-standard-build.log",
          ]

          env_always = {"00-environment.log"}
          error_re = re.compile(r"\berror:\s", re.IGNORECASE)
          match_patterns = [
              error_re,
              re.compile(r"\bwarning:\s", re.IGNORECASE),
              re.compile(r"Test Case '.*' (passed|failed)"),
              re.compile(r"Test Suite '.*' (passed|failed)"),
              re.compile(r"^\s*Executed \d+ tests?"),
              re.compile(r"\*\* (TEST BUILD|TEST) (SUCCEEDED|FAILED) \*\*"),
              re.compile(r"^Failing tests:"),
          ]

          out_lines = []
          for path in log_files:
              if not os.path.exists(path):
                  continue
              name = os.path.basename(path)
              out_lines.append(f"=== {name} ===")
              with open(path, encoding="utf-8", errors="replace") as f:
                  context_left = 0
                  for line in f:
                      clean = line.rstrip("\n")
                      if name in env_always:
                          out_lines.append(clean)
                      elif error_re.search(clean):
                          out_lines.append(clean)
                          context_left = 2
                      elif context_left > 0:
                          out_lines.append(clean)
                          context_left -= 1
                      elif any(p.search(clean) for p in match_patterns):
                          out_lines.append(clean)

          summary_text = "\n".join(out_lines) if out_lines else "No diagnostic lines captured."
          with open(".ci-logs/text/00-diagnostics-summary.txt", "w", encoding="utf-8") as out:
              out.write(summary_text + "\n")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as s:
                  s.write("## iOS Build & Test Diagnostics\n\n```text\n")
                  s.write(summary_text[:65000])
                  s.write("\n```\n")
          PY

      - name: Upload Downloadable Text Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ci-logs-${{ github.run_number }}
          path: .ci-logs/text
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Upload Xcode Result Bundle on Failure (.xcresult)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult-${{ github.run_number }}
          path: .ci-logs/TestResults.xcresult
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
